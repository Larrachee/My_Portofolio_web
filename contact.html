<section id="contact" class="section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title"><span class="title-kanji">連絡</span><span class="title-text">Contact Me</span></h2>
            <p class="section-subtitle">れんらく</p>
        </div>
        <div class="contact-grid">
            <div class="contact-info">
                <h3>お気軽にご連絡ください</h3>
                <p>Let's connect for collaborations or opportunities.</p>
                <div class="contact-item">
                    <div class="contact-icon"><i class="fas fa-phone"></i></div>
                    <div>
                        <h4>Phone</h4>
                        <p>+6282119405410</p>
                    </div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                    <div>
                        <h4>Email</h4>
                        <p>andreasashun123@gmail.com</p>
                    </div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon"><i class="fab fa-linkedin"></i></div>
                    <div>
                        <h4>LinkedIn</h4>
                        <p>linkedin.com/in/andreas-pangjiashun</p>
                    </div>
                </div>
            </div>
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group"><input type="text" name="from_name" class="form-input"
                            placeholder="Your Name" required></div>
                    <div class="form-group"><input type="email" name="reply_to" class="form-input"
                            placeholder="Your Email" required></div>
                    <div class="form-group"><input type="text" name="subject" class="form-input" placeholder="Subject"
                            required></div>
                    <div class="form-group"><textarea name="message" class="form-input" rows="5"
                            placeholder="Your Message" required></textarea></div><button type="submit"
                        class="btn btn-primary btn-submit"><i class="fas fa-paper-plane"></i> Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
